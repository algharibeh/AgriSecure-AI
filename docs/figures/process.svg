<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect width="1100" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1a202c">AgriSecure-AI — what was done, in order (October 2026)</text>

  <!-- lane labels -->
  <text x="20" y="80" font-size="12" font-weight="bold" fill="#718096">PHASE 1 · data</text>
  <text x="20" y="215" font-size="12" font-weight="bold" fill="#718096">PHASE 1 · detection</text>
  <text x="20" y="335" font-size="12" font-weight="bold" fill="#718096">PHASE 2 · embedded</text>

  <!-- Phase 1 data row -->
  <g>
    <rect x="150" y="55" width="200" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
    <text x="250" y="78" text-anchor="middle" font-weight="bold" fill="#1a202c">Public tractor recordings</text>
    <text x="250" y="96" text-anchor="middle" fill="#2d3748">Tümosan 81.110 P · 24.7 h · CC BY 4.0</text>
    <text x="250" y="110" text-anchor="middle" font-size="11" fill="#4a5568">decoded signals, 10 Hz, 10 fields</text>

    <rect x="400" y="55" width="200" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
    <text x="500" y="78" text-anchor="middle" font-weight="bold" fill="#1a202c">J1939 frame reconstruction</text>
    <text x="500" y="96" text-anchor="middle" fill="#2d3748">~5.16 M frames, standard PGNs</text>
    <text x="500" y="110" text-anchor="middle" font-size="11" fill="#4a5568">lossless to SPN resolution, verified</text>

    <rect x="650" y="55" width="200" height="60" rx="8" fill="#fff5f5" stroke="#e53e3e"/>
    <text x="750" y="78" text-anchor="middle" font-weight="bold" fill="#1a202c">Seeded attack injection</text>
    <text x="750" y="96" text-anchor="middle" fill="#2d3748">5 families · 72 episodes · labelled</text>
    <text x="750" y="110" text-anchor="middle" font-size="11" fill="#4a5568">simulated; fields 7–10 only</text>

    <rect x="900" y="55" width="180" height="60" rx="8" fill="#f0fff4" stroke="#2f855a"/>
    <text x="990" y="78" text-anchor="middle" font-weight="bold" fill="#1a202c">Labelled dataset</text>
    <text x="990" y="96" text-anchor="middle" fill="#2d3748">datasheet · checksums</text>
    <text x="990" y="110" text-anchor="middle" font-size="11" fill="#4a5568">clean 1–6 / attacked 7–10</text>

    <line x1="350" y1="85" x2="398" y2="85" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="600" y1="85" x2="648" y2="85" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="850" y1="85" x2="898" y2="85" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- threat model side box -->
  <rect x="150" y="135" width="200" height="44" rx="8" fill="#fffaf0" stroke="#dd6b20"/>
  <text x="250" y="153" text-anchor="middle" font-weight="bold" fill="#1a202c">Threat model</text>
  <text x="250" y="170" text-anchor="middle" font-size="11" fill="#4a5568">ISO/SAE 21434-style · defines the 5 families</text>
  <line x1="350" y1="157" x2="640" y2="157" stroke="#dd6b20" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="640" y1="157" x2="700" y2="117" stroke="#dd6b20" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- Phase 1 detection row -->
  <g>
    <rect x="400" y="190" width="200" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0"/>
    <text x="500" y="213" text-anchor="middle" font-weight="bold" fill="#1a202c">Rule-based IDS</text>
    <text x="500" y="231" text-anchor="middle" fill="#2d3748">address · rate · physics · rate-of-change</text>
    <text x="500" y="245" text-anchor="middle" font-size="11" fill="#4a5568">learned from clean fields only</text>

    <rect x="650" y="190" width="200" height="60" rx="8" fill="#f0fff4" stroke="#2f855a"/>
    <text x="750" y="213" text-anchor="middle" font-weight="bold" fill="#1a202c">Phase 1 result</text>
    <text x="750" y="231" text-anchor="middle" fill="#2d3748">F1 0.935 · FPR 0.05 %</text>
    <text x="750" y="245" text-anchor="middle" font-size="11" fill="#4a5568">4 of 5 families; freeze missed</text>

    <line x1="990" y1="115" x2="990" y2="160" stroke="#4a5568" stroke-width="1.5"/>
    <line x1="990" y1="160" x2="500" y2="160" stroke="#4a5568" stroke-width="1.5"/>
    <line x1="500" y1="160" x2="500" y2="188" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="600" y1="220" x2="648" y2="220" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- Phase 2 row -->
  <g>
    <rect x="150" y="310" width="200" height="60" rx="8" fill="#faf5ff" stroke="#805ad5"/>
    <text x="250" y="333" text-anchor="middle" font-weight="bold" fill="#1a202c">Tiny context model</text>
    <text x="250" y="351" text-anchor="middle" fill="#2d3748">1 s windows · 129 parameters</text>
    <text x="250" y="365" text-anchor="middle" font-size="11" fill="#4a5568">trained on clean traffic only</text>

    <rect x="400" y="310" width="200" height="60" rx="8" fill="#faf5ff" stroke="#805ad5"/>
    <text x="500" y="333" text-anchor="middle" font-weight="bold" fill="#1a202c">int8 export + C reference</text>
    <text x="500" y="351" text-anchor="middle" fill="#2d3748">self-test: 0 flag mismatches</text>
    <text x="500" y="365" text-anchor="middle" font-size="11" fill="#4a5568">dependency-free C99</text>

    <rect x="650" y="310" width="200" height="60" rx="8" fill="#f0fff4" stroke="#2f855a"/>
    <text x="750" y="333" text-anchor="middle" font-weight="bold" fill="#1a202c">Cortex-M size + SIL replay</text>
    <text x="750" y="351" text-anchor="middle" fill="#2d3748">1,300 B on M4 · rules flag in ≤ 1.3 ms</text>
    <text x="750" y="365" text-anchor="middle" font-size="11" fill="#4a5568">plan target 10 KB · virtual bus</text>

    <rect x="900" y="310" width="180" height="60" rx="8" fill="#ffffff" stroke="#a0aec0" stroke-dasharray="6 4"/>
    <text x="990" y="333" text-anchor="middle" font-weight="bold" fill="#718096">Hardware-in-the-loop</text>
    <text x="990" y="351" text-anchor="middle" fill="#718096">open — needs a bus or rig</text>
    <text x="990" y="365" text-anchor="middle" font-size="11" fill="#a0aec0">Phase 1 and Phase 2 item</text>

    <line x1="500" y1="250" x2="500" y2="280" stroke="#4a5568" stroke-width="1.5"/>
    <line x1="500" y1="280" x2="250" y2="280" stroke="#4a5568" stroke-width="1.5"/>
    <line x1="250" y1="280" x2="250" y2="308" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="350" y1="340" x2="398" y2="340" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="600" y1="340" x2="648" y2="340" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="850" y1="340" x2="898" y2="340" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  </g>

  <text x="20" y="405" font-size="11" fill="#4a5568">Everything in solid boxes ran in software on one PC and is reproducible from the scripts; the C code was compiled for a Cortex-M, not run on one. No vehicle, physical bus or real system was involved.</text>
</svg>
